media:
  input: "public/uploads"
  output: "/uploads"
content:
  - name: "blog"
    label: "Blog"
    type: collection
    path: "src/content/blog"
    extension: "mdx"
    format: "yaml-frontmatter"
    filename: "{title}.mdx"
    fields:
      - name: "title"
        label: "Title"
        type: "string"
      - name: "categories"
        label: "Categories"
        type: "string"
        list: true
      - name: "pubDate"
        label: "Date"
        type: "date"
      - name: "description"
        label: "Description"
        type: "text"
      - name: "image"
        label: "Image"
        type: "image"
      - name: "body"
        label: "Body"
        type: "rich-text"

  - name: "projeto"
    label: "Projeto"
    type: collection
    path: "src/content/projects"
    extension: "mdx"
    format: "yaml-frontmatter"
    filename: "{title}.mdx"
    fields:
      - name: "title"
        label: "Title"
        type: "string"
      - name: "link"
        label: "Project Link"
        type: "string"
      - name: "image"
        label: "Image"
        type: "image"
      - name: "techs"
        label: "Techs"
        type: "string"
        list: true
      - name: "description"
        label: "Description"
        type: "text"
      - name: "body"
        label: "Body"
        type: "rich-text"